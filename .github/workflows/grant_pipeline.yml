name: NGO Grant Finder & Automated Proposal Pipeline

on:
  schedule:
    # Runs daily at 06:00 UTC (9:00 AM EAT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-grant-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database & NGO Profile Setup
        run: python db_config.py

      - name: Run Multi-Source Grant Scrapers
        run: python multi_source_scraper.py

      - name: Run Gemini AI Evaluation & Notifications
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python ai_notifier_engine.py

      - name: Commit & Push Updated SQLite Database Artifacts
      permissions:
        contents: write
      run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add organization.db
          git commit -m "auto: update grant database [skip ci]" || exit 0
          git push