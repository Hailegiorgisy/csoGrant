name: Ease Africa Opportunity & Grant Agent

on:
  schedule:
    # 04:30 UTC = 07:30 AM EAT (Addis Ababa time)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  run-grant-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit seen_opportunities.json back to repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Daily Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python grant_agent.py

      - name: Commit & Push Updated History
        run: |
          git config --global user.name "Ease Africa Grant Bot"
          git config --global user.email "bot@easeafrica.local"
          git add seen_opportunities.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen opportunities [skip ci]" && git push)